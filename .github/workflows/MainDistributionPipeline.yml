#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.2
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5.2
      extension_name: us_geocoder
      # Skip WASM (mvp/eh/threads) and Intel macOS. Build everything else:
      # linux_amd64, linux_arm64, osx_arm64, windows_amd64_mingw, and
      # windows_amd64 (MSVC). us_address_standardizer ships MSVC builds
      # so the from_pagc test no longer auto-skips on that target.
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;osx_amd64
      # spatial is built as a test dep (via DEFAULT_TEST_EXTENSION_DEPS in
      # the Makefile) so `LOAD spatial` works in CI sqllogic. Spatial needs
      # vcpkg deps (zlib, etc) that aren't in our vcpkg.json — merging at
      # build time lets the spatial extension's own manifest contribute.
      use_merged_vcpkg_manifest: "1"
      # Make `require us_geocoder` actually load our extension in CI.
      # The runner gates on TWO independent things, BOTH set via env vars
      # (extension-ci-tools only forwards `test_env_variables` keys from
      # test_config to the test process — top-level keys here are dropped):
      #   1. DUCKDB_TEST_AUTOLOADING=available — TestConfiguration reads
      #      env vars of the form DUCKDB_TEST_<OPTION_UPPER> at startup.
      #      Without this the runner's CheckRequire() short-circuits
      #      `require <non-core-ext>` to MISSING and EVERY test skips,
      #      regardless of static linkage. AVAILABLE makes the runner do
      #      INSTALL+LOAD from LOCAL_EXTENSION_REPO.
      #   2. LOCAL_EXTENSION_REPO pointing at the build's repo dir so the
      #      INSTALL finds the just-built us_geocoder.duckdb_extension.
      # Both are needed; either alone leaves us skipped.
      test_config: '{"test_env_variables": {"DUCKDB_TEST_AUTOLOADING": "available", "LOCAL_EXTENSION_REPO": "/duckdb_build_dir/build/release/repository"}}'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.2
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5.2
      extension_name: us_geocoder
      format_checks: 'format;tidy'
