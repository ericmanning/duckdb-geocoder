#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.2
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5.2
      extension_name: us_geocoder
      # Skip Windows MSVC, WASM (mvp/eh/threads), and Intel macOS — same matrix
      # the us_address_standardizer community extension ships on. Native build
      # matrix is linux_amd64, linux_arm64, osx_arm64.
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;osx_amd64
      # Point the test runner at the build's local extension repo so
      # `require splink_udfs` (which our test files use) resolves to the
      # splink_udfs.duckdb_extension that extension_config.cmake builds at
      # configure time. Without this the test runner has autoload off by
      # default and require falls back to a disk-cache lookup that fails.
      test_config: '{"test_env_variables": {"LOCAL_EXTENSION_REPO": "/duckdb_build_dir/build/release/repository"}}'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.2
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5.2
      extension_name: us_geocoder
      format_checks: 'format;tidy'
