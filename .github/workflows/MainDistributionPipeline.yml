#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.2
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5.2
      extension_name: us_geocoder
      # Skip WASM (mvp/eh/threads) and Intel macOS. Build everything else:
      # linux_amd64, linux_arm64, osx_arm64, windows_amd64_mingw, and
      # windows_amd64 (MSVC). us_address_standardizer ships MSVC builds
      # so the from_pagc test no longer auto-skips on that target.
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;osx_amd64
      # Make `require us_geocoder` actually load our extension in CI.
      # The runner gates on TWO independent things:
      #   1. autoloading mode != NONE — without this, `require <non-core ext>`
      #      short-circuits to MISSING and EVERY test skips, regardless of
      #      static linkage. Setting "autoloading": "available" makes the
      #      runner perform INSTALL+LOAD from LOCAL_EXTENSION_REPO.
      #   2. LOCAL_EXTENSION_REPO pointing at the build's repo dir so the
      #      INSTALL finds the just-built us_geocoder.duckdb_extension.
      # Both are needed; either alone leaves us skipped.
      test_config: '{"autoloading": "available", "test_env_variables": {"LOCAL_EXTENSION_REPO": "/duckdb_build_dir/build/release/repository"}}'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.2
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5.2
      extension_name: us_geocoder
      format_checks: 'format;tidy'
